```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <div class="weather-card">

            <h1>Weather App</h1>
            <p class="subtitle">Get real-time weather information</p>

            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                >
                <button id="searchBtn">Search</button>
            </div>

            <button class="location-btn" id="locationBtn">
                📍 Use My Location
            </button>

            <p id="error"></p>

            <div class="weather-info" id="weatherInfo">

                <div class="location">
                    <h2 id="city">--</h2>
                    <p id="country">--</p>
                </div>

                <img id="weatherIcon" src="" alt="Weather Icon">

                <div class="temperature">
                    <h2 id="temperature">--°C</h2>
                    <p id="condition">--</p>
                </div>

                <div class="details">

                    <div class="detail-box">
                        <span>💧</span>
                        <div>
                            <p>Humidity</p>
                            <h3 id="humidity">--%</h3>
                        </div>
                    </div>

                    <div class="detail-box">
                        <span>💨</span>
                        <div>
                            <p>Wind Speed</p>
                            <h3 id="wind">-- km/h</h3>
                        </div>
                    </div>

                    <div class="detail-box">
                        <span>🌡️</span>
                        <div>
                            <p>Feels Like</p>
                            <h3 id="feelsLike">--°C</h3>
                        </div>
                    </div>

                    <div class="detail-box">
                        <span>🔵</span>
                        <div>
                            <p>Pressure</p>
                            <h3 id="pressure">-- hPa</h3>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
```
